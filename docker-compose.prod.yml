version: '3.8'

services:
  app:
    image: brick-kiln-app:latest
    container_name: brick-kiln-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always

    # FIX: avoid port already allocated error
    ports:
      - "3001:3000"

    environment:
      # Production Database Connection String
      DATABASE_URL: ${DATABASE_URL}

      # JWT Secret for Auth
      JWT_SECRET: ${JWT_SECRET}

      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

      NODE_ENV: production
      PORT: 3000

    networks:
      - brick-kiln-network

networks:
  brick-kiln-network:
    driver: bridge
